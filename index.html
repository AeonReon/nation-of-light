<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Light School</title>
<meta name="description" content="Light School. Twenty-five tiny actions in one sitting, with Marcus Aurelius beside you in the portico at dawn. Momentum first; his own words, nothing else.">
<meta name="theme-color" content="#2F3D72">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Light School">
<link rel="manifest" href="manifest.webmanifest?v=46">
<link rel="apple-touch-icon" href="images/icon-180.png?v=46">
<link rel="icon" href="images/icon-192.png?v=46">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="style.css?v=46">
</head>
<body>
<div class="stage" id="stage">
  <div class="scene" id="scene">
    <div id="portico"></div>
    <div class="hud" id="hud" hidden>
      <div class="pill" id="countpill" title="done"><svg class="flame-ic" viewBox="0 0 16 20"><path d="M8 19c-3.6 0-6-2.5-6-5.8 0-2.6 1.6-4.3 2.7-5.6.6-.7 1-1.3 1.2-2 .6 1.1 1.2 2 2 2.7C9.7 10 11 11.4 11 13.6c0 1.2-.5 2.3-1.2 3 .9-.2 4.2-1.6 4.2-5.7 0-3.2-2.2-5-3.5-6.6C9.4 3 8.9 1.8 9 0c-3 1.4-3.4 4.3-3.6 5.8C4.6 4.7 4.2 3.4 4.2 2 1.7 3.8 0 7.2 0 10.6 0 15.6 3.7 19 8 19z" fill="#E0812A"/><path d="M8 19c-1.9 0-3.2-1.4-3.2-3.2 0-1.5 1-2.4 1.6-3.2.4-.5.6-.9.7-1.4.5.8.9 1.3 1.4 1.8.7.7 1.6 1.6 1.6 2.8C10.1 17.6 9.2 19 8 19z" fill="#FFD36B"/></svg><span><b id="countn">0</b> <span class="of">done of <span id="countof">25</span></span></span></div>
      <div class="right">
        <button class="round" id="soundbtn" aria-label="Sound"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 010 7M19 5.5a9 9 0 010 13"/></svg></button>
        <button class="round" id="helpbtn" aria-label="Help">?</button>
      </div>
    </div>
    <div class="afig is-hidden" id="afig" role="button" aria-label="Aurelia"></div>
    <div class="mfig is-hidden" id="mfig" role="button" aria-label="Marcus"></div>
    <div class="bubble" id="bubble" hidden></div>
    <div class="bubble abubble" id="abubble" hidden></div>
  </div>
  <div class="capband" id="capband" hidden></div>
  <div class="deck" id="deck" hidden>
    <div class="laurel"><div class="bar" id="laurelbar"></div></div>
    <div class="tierline" id="tierline"></div>
    <div class="tablet" id="tablet" hidden>
      <div class="top"><span class="num" id="tnum">Tablet 1</span><span class="kind" id="tkind"></span></div>
      <div class="test" id="ttext"></div>
      <div class="fall" id="tfall"></div>
      <div class="row">
        <button class="btn btn-ghost" id="readbtn"><svg class="spk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 010 7M19 5.5a9 9 0 010 13"/></svg><span class="eq"><i></i><i></i><i></i></span><span>Read it</span></button>
        <button class="btn btn-gold" id="donebtn">Done</button>
      </div>
      <button class="skip" id="skipbtn">Not this one today</button>
    </div>
  </div>
  <div class="school" id="school" hidden>
    <div class="shead" id="shead"><button class="homebtn" id="homebtn" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 9h18M4 9v10M9 9v10M15 9v10M20 9v10M2 19h20M12 3l9 6H3z"/></svg><span class="stitle">Light School</span></button><button class="roombtn searchbtn" id="searchbtn" aria-label="Search the school"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg></button></div>
    <div class="stabs" id="stabs"></div>
    <div class="sline" id="sline"></div>
    <div class="slist" id="slist"></div>
  </div>
  <div class="pop" id="pop"><div class="popcap" id="popcap" hidden></div></div>
  <button class="backbtn" id="stageback" hidden aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div class="ver">v46</div>
  <div id="overlay"></div>
</div>
<script src="rig.js?v=46"></script>
<script src="scene.js?v=46"></script>
<script src="app.js?v=46"></script>
</body>
</html>
